# ─────────────────────────────────────────────────────────────
# Lnbo 博客 nginx 配置(参考模板,由 deploy/setup.sh 自动生成实际配置)
# 手动部署:把 {{DOMAIN}} 换成你的域名、{{WEBROOT}} 换成站点根目录(如
# /www/wwwroot/site),证书路径按实际修改;纯 HTTP 部署删掉 443 段即可。
# 两个文件:
#   1) /etc/nginx/conf.d/blog-visitors.conf  ← log_format(visitors 埋点格式)
#   2) /etc/nginx/conf.d/blog.conf           ← server 块
# ─────────────────────────────────────────────────────────────

# ============ 1. blog-visitors.conf(http 级,勿放进 server) ============
log_format visitors '$time_iso8601|$arg_id|$arg_path|$arg_ref|$remote_addr|$http_user_agent';

# ============ 2. blog.conf ============
server {
    listen 80;
    server_name {{DOMAIN}};
    # 有了证书后开启以下三行做 HTTPS 跳转
    # return 301 https://$host$request_uri;

    root {{WEBROOT}};          # 例:/www/wwwroot/site(博客在其下 blog/ 子目录)
    index index.html;
    access_log /www/wwwlogs/blog-access.log;
    error_log  /www/wwwlogs/blog-error.log;

    # ── 交互 API 反代到 blog-api.service ──
    location /api/ {
        proxy_pass http://127.0.0.1:9540;
        proxy_set_header Host $host;
    }

    # ── 访客埋点:前端打 /collect?id=..&path=..,nginx 直接记日志(零后端开销) ──
    location = /collect {
        access_log /www/wwwlogs/visitors.log visitors;
        return 204;
    }

    # 静态资源缓存 7 天;HTML 不缓存保证更新即时可见
    location /blog/assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* ^/blog/.*\.html$ {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}

